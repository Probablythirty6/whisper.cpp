name: android-voice-server

on:
  workflow_dispatch:
  push:
    branches: [dfr1221-voice-server]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install SDK and NDK pieces
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"

      - name: Build debug APK
        working-directory: examples/whisper.android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: dfr1221-voice-server-apk
          path: examples/whisper.android/app/build/outputs/apk/debug/*.apk
