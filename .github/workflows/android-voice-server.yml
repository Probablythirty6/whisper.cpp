name: android-voice-server

on:
  workflow_dispatch:
  push:
    branches: [dfr1221-voice-server]
    paths:
      - "examples/whisper.android/**"
      - ".github/workflows/android-voice-server.yml"

permissions:
  contents: write

concurrency:
  group: android-voice-server
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Keep the debug signing key between builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Install SDK and NDK pieces
        run: (yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true) > /dev/null; $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"

      - name: Build debug APK
        working-directory: examples/whisper.android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: dfr1221-voice-server-apk
          path: examples/whisper.android/app/build/outputs/apk/debug/*.apk

      - name: Publish to the fixed latest tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=examples/whisper.android/app/build/outputs/apk/debug/app-debug.apk
          SUM=$(sha256sum "$APK" | cut -d' ' -f1)
          gh release delete voice-server-latest --cleanup-tag --yes || true
          gh release create voice-server-latest "$APK" --title "DFR1221 voice server (latest)" --notes "Debug APK built from ${GITHUB_SHA::7}. sha256 $SUM" --target "$GITHUB_SHA"
